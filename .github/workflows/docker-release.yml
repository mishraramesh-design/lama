name: Build & Push LAMA image

# Triggers:
#  - push to `main`         → builds and pushes  mishramesh/lama:latest  (+ sha tag)
#  - tag push `v*.*.*`      → builds and pushes  mishramesh/lama:v1.2.3  (+ :latest)
#  - manual dispatch        → builds and pushes  mishramesh/lama:latest
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to apply (defaults to "latest")'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mishramesh/lama
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=LAMA
            org.opencontainers.image.description=Legacy Application Modernization & Alignment — single-image bundle (frontend + FastAPI + MongoDB + Nginx)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=mishramesh
            org.opencontainers.image.licenses=Proprietary

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: false

      - name: Image digest
        run: |
          echo "Pushed tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Pull on your Hostinger VPS:"
          echo "  docker pull mishramesh/lama:latest"
